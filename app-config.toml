# SPDX-License-Identifier: GPL-3.0-or-later

app-name = "gui-app-cake-signer"
friendly-app-name = "Cake Wallet Signer"
launcher-app-name = "Cake"
description = "A Monero cold signer and Cake Wallet companion for Passport Prime."
icon = "resources/icon.svg"
theme = "resources/theme.json"
# Stable identity: changing this changes every app-seed-derived Monero wallet.
app-id = "0x63616b652d786d722d7369676e657221"
version = "0.2.0"
min-keyos-version = "1.4.0"

[publisher]
name = "Foundation Devices"
contact-email = "hello@foundation.xyz"
support-url = "https://foundation.xyz/support"

[permissions]
template = ["gui-app", "fs-generic", "navigable"]
"os/security" = ["GetAppSeed"]
"os/fs" = [
    "GetAirlockReadAccess", "GetAirlockWriteAccess",
    "GetUserReadAccess", "GetUserWriteAccess",
    "GetUsbReadAccess", "GetUsbWriteAccess",
]
