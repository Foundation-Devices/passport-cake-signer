app-name = "gui-app-cake-signer"
friendly-app-name = "Cake Wallet Signer"
launcher-app-name = "Cake"
description = "A Monero cold signer and Cake Wallet companion for Passport Prime."
icon = "resources/icon.png"
theme = "resources/theme.json"
# Stable identity: changing this changes every app-seed-derived Monero wallet.
app-id = "0x63616b652d786d722d7369676e657221"
version = "0.2.1"
# MUST carry the pre-release suffix. app-manager compares this as a semver
# Version, and a pre-release sorts BELOW its release — so a plain "1.4.0" floor
# refuses to launch on every 1.4.0 beta with "the app requires a newer KeyOS
# version", which is what users are actually running.
min-keyos-version = "1.4.0-beta2"

[publisher]
name = "Foundation Devices"
contact-email = "hello@foundation.xyz"
support-url = "https://foundation.xyz/support"

# Route Cake Wallet's animated unsigned-transaction UR from Launcher's universal
# QR scanner into this app. The CLI adds GetPendingNavRequest automatically.
[[qr-match-rules]]
id = "xmr-txunsigned"
priority = 5
id-localizations = { en = "Monero Unsigned Transaction" }
sub-rules = { ur = { UR = { ur-type = "xmr-txunsigned" } } }

[permissions]
template = ["gui-app", "fs-generic", "navigable"]
"os/security" = ["GetAppSeed"]
"os/fs" = [
    "GetAirlockReadAccess", "GetAirlockWriteAccess",
    "GetUserReadAccess", "GetUserWriteAccess",
    "GetUsbReadAccess", "GetUsbWriteAccess",
]
