[package]
name = "gui-app-cake-signer"
version = "0.2.1"
edition = "2021"
authors = ["Foundation Devices, Inc. <hello@foundation.xyz>"]
license = "GPL-3.0-or-later"

[workspace]
exclude = [".foundation-sdk", "mobile-wallet"]

[dependencies]
# The Foundation CLI creates this project-local SDK mapping automatically.
# No KeyOS source checkout is required.
fs = { path = ".foundation-sdk/current/lib/keyos/api/fs" }
security = { path = ".foundation-sdk/current/lib/keyos/api/security" }
settings = { path = ".foundation-sdk/current/lib/keyos/api/settings" }
server = { path = ".foundation-sdk/current/lib/keyos/server" }
slint-keyos-platform = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/runtime" }
foundation-themes = { path = ".foundation-sdk/current/lib/keyos/sdk/crates/foundation-themes" }
log = "0.4"
log-server = { package = "xous-api-log", path = ".foundation-sdk/current/lib/keyos/xous/api/log" }
foundation-ur = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
phf = { version = "0.11", features = ["macros"] }

# Cross-target utilities
anyhow = "1"
base64 = "0.22"
hex = "0.4"
# CBOR wrapping for UR (Uniform Resources) animated-QR transport. The UR payload
# is a single CBOR bytestring of the raw wallet2 blob — the exact wire format
# CupCake/Cake speak (see src/qr.rs). Matches the Bitcoin app's minicbor pin.
minicbor = { version = "0.24", features = ["std", "derive"] }

# --- Monero crypto -------------------------------------------------------
# Key derivation + address encoding (src/monero/keys.rs + address.rs) are the
# verified, inlined core (mirrors how the Liana signer inlines its logic from
# liana-signer-core; here the host-test home is ../monero-cold-core, kept in
# sync). Both crates below are ALREADY in the KeyOS workspace lock
# (curve25519-dalek 4.1.3, sha3 0.10.8), so they build for the device target.
# No randomness is needed (keys derive deterministically from the app seed), so
# no getrandom-on-xous dependency.
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
sha3 = { version = "0.10", default-features = false }
# Polyseed (16-word Monero seed) — vetted impl by the monero-oxide author. The
# wallet's keys are derived from a Polyseed seeded by the KeyOS app seed, so this
# is ALL-TARGET (device + sim must derive the same wallet). no_std (alloc) via
# default-features = false. Proven in ../../../monero-cold-core (polyseed.rs).
polyseed = { git = "https://github.com/kayabaNerve/monero-wallet-util", rev = "797fe701a6f9e99ae614c49479bb981de1afe8ec", default-features = false }
# Legacy 24/25-word Monero mnemonic parser from the same audited utility repo
# as Polyseed. Used only for importing an existing Monero seed into this app.
monero-seed = { git = "https://github.com/kayabaNerve/monero-wallet-util", rev = "797fe701a6f9e99ae614c49479bb981de1afe8ec", default-features = false }
# Zeroizing secret material (Polyseed entropy/key); all-target since key
# derivation runs on device + sim.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# --- Decryption + signing — ALL-TARGET (runs on the device too) -----------
# wallet2 unsigned_tx_set decryption needs cn_slow_hash (CryptoNight) for the
# chacha key. Upstream Cuprate, used as-is: KeyOS is a std target, so the crate
# needs no no_std patch and there is nothing to vendor. (This was previously a
# hand-patched no_std copy under vendor/; that patch was never necessary.)
cuprate-cryptonight = { git = "https://github.com/Cuprate/cuprate", rev = "0b64b33dcd7f50168a5ba4d6d58a5a210b1cbc59" }
chacha20 = { version = "0.9", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# RingCT/CLSAG + Bulletproof+ signing (serai / monero-oxide). no_std (alloc);
# the signer seeds a deterministic ChaCha20Rng, so no getrandom on xous.
monero-wallet = { git = "https://github.com/monero-oxide/monero-oxide.git", rev = "731657ae3385be667abb556266369a497bc86f13", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }

[build-dependencies]
slint-keyos-platform-build = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/build", default-features = false }

[patch.crates-io]
getrandom = { path = ".foundation-sdk/current/lib/keyos/imports/getrandom" }
# UI2's host-side theme crate declares a broad crates.io Slint range. Pin its
# graph to the exact Foundation fork shipped by the 1.4 SDK so two Slint ABIs
# cannot enter the device link.
slint = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
slint-build = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
slint-macros = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-common = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-compiler = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-core = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-core-macros = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-backend-selector = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-renderer-software = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
const-field-offset = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
const-field-offset-macro = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(keyos)', 'cfg(foundation_internal_quantum_link)'] }
