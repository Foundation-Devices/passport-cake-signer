# SPDX-License-Identifier: MIT
# Vendored from Cuprate's `cryptonight` crate (dimalinux, Boog900, The Monero
# Project) — github.com/Cuprate/cuprate/tree/main/cryptonight — patched to
# `no_std` so the wallet2 txset decryption key (cn_slow_hash v0) can be derived
# on the Passport Prime (xous) device, not just host/sim. Only the v0 entry point
# is exported. Output is byte-identical to cuprate-cryptonight (parity-tested).
[package]
name = "cryptonight-noxous"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "no_std CryptoNight v0 (vendored from Cuprate) for KeyOS/xous"

[workspace]
resolver = "2"

[dependencies]
sha3 = { version = "0.10.8", default-features = false }
groestl = { version = "0.10.1", default-features = false }
skein = { version = "0.1.0", default-features = false }
jh = { version = "0.1.0", default-features = false }
keccak = { version = "0.1.5", default-features = false }
digest = { version = "0.10.7", default-features = false }
seq-macro = "0.3.5"
libm = "0.2.16"
